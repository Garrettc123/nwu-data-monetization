name: NWU Asset Registration Safety Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependency
        run: python -m pip install pytest
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Validate all asset and bond tests without network credentials
        run: python -m pytest -q tests
